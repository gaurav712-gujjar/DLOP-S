<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Tumor Detection</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0a0a0a,#1a1a2e,#16213e);
    min-height:100vh;
    color:#fff;
}

h3 span{color:#e94560;}

.card-ui{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
}

.image-box{
    height:320px;
    width:320px;
    border-radius:12px;
    border:2px dashed rgba(255,255,255,.3);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin:auto;
}

.image-box img,video{
    height:100%;
    width:100%;
    object-fit:cover;
    display:none;
}

.btn-custom{
    border-radius:30px;
    padding:10px 24px;
    font-weight:600;
}

.btn-upload{background:#2196f3;color:#fff;}
.btn-predict{background:#e94560;color:#fff;}
.btn-custom:hover{opacity:.9}

.result-box{
    height:320px;
    background:rgba(0,0,0,.3);
    border-radius:12px;
    padding:10px;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

.result-label{
    font-size:24px;
    font-weight:700;
    text-align:center;
}

.tumor { color:#e94560; }
.no-tumor { color:#4caf50; }

pre{
    color:#00e5ff;
    font-size:14px;
}

#loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loader{
    width:60px;
    height:60px;
    border:6px solid #555;
    border-top:6px solid #e94560;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div class="container py-5">

<h3 class="text-center mb-2">
    🧠 Brain Tumor <span>Detection</span>
</h3>
<p class="text-center text-muted mb-4">Upload a Brain MRI image to detect tumor</p>

<div class="row">

<!-- LEFT -->
<div class="col-md-6 mb-4">
    <div class="card-ui text-center">
        <p class="mb-2">Upload MRI Image</p>
        <div class="image-box mb-3">
            <video autoplay id="video"></video>
            <img id="photo">
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <button class="btn btn-custom btn-upload mr-2" id="uload">📁 Upload Image</button>
        <button class="btn btn-custom btn-predict" id="send">🔍 Predict</button>

        <input type="hidden" id="url" value="../predict">
        <input type="file" id="fileinput" hidden accept="image/*">
    </div>
</div>

<!-- RIGHT -->
<div class="col-md-6">
    <div class="card-ui">
        <h5 class="text-center mb-3">Prediction Result</h5>
        <div class="result-box" id="jsonResult">
            <p class="text-muted">Result will appear here...</p>
        </div>
    </div>
</div>

</div>
</div>

<div id="loading"><div class="loader"></div></div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<script>
let base_data="";

function sendRequest(base64Data){
    if(!base64Data) return;

    $("#loading").show();

    $.ajax({
        url: $("#url").val(),
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ image: base64Data }),
        success: function(res){
            let label = res[0].image;
            let cssClass = label === "Tumor Detected" ? "tumor" : "no-tumor";
            let icon = label === "Tumor Detected" ? "⚠️" : "✅";

            $("#jsonResult").html(
                "<div class='result-label " + cssClass + "'>" +
                icon + "<br>" + label +
                "</div>"
            );
            $("#loading").hide();
        },
        error: function(){
            $("#jsonResult").html("<p class='text-danger'>Error occurred. Try again.</p>");
            $("#loading").hide();
        }
    });
}

$("#send").click(()=>sendRequest(base_data));
$("#uload").click(()=>$("#fileinput").click());

$("#fileinput").change(function(){
    let reader=new FileReader();
    reader.onload=e=>{
        let img=new Image();
        img.onload=function(){
            let canvas=document.createElement("canvas");
            canvas.width=this.width;
            canvas.height=this.height;
            canvas.getContext("2d").drawImage(this,0,0);
            base_data=canvas.toDataURL("image/jpeg").replace(/^data:image.+;base64,/,"");
        }
        img.src=e.target.result;
        $("#photo").attr("src",e.target.result).show();
        $("#video").hide();
    }
    reader.readAsDataURL(this.files[0]);
});

$("#loading").hide();
</script>

</body>
</html>
